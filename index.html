<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arrow Out — 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #d8efe8;
      --bg1: #c5e4f5;
      --ink: #1a2f38;
      --muted: #4a6670;
      --panel: rgba(255, 255, 255, 0.72);
      --accent: #2a9d8f;
      --accent-hover: #238b7e;
      --danger: #e76f51;
      --shadow: 0 12px 40px rgba(26, 47, 56, 0.12);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Outfit", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 800px at 15% 10%, #e8f8f3 0%, transparent 55%),
        radial-gradient(1000px 700px at 90% 80%, #d0ebf8 0%, transparent 50%),
        linear-gradient(145deg, var(--bg0), var(--bg1));
    }

    #app {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    #hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 12px 18px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 999px;
      box-shadow: var(--shadow);
      user-select: none;
      pointer-events: auto;
    }

    #reset-btn {
      position: relative;
      z-index: 11;
      min-width: 88px;
    }

    #hud .brand {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }

    #hud .divider {
      width: 1px;
      height: 22px;
      background: rgba(26, 47, 56, 0.15);
    }

    #remaining {
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 500;
    }

    #remaining strong {
      color: var(--ink);
      font-weight: 700;
    }

    button {
      font-family: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      border: none;
      border-radius: 999px;
      padding: 8px 16px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      transform: scale(0.97);
    }

    #size-picker {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      background: rgba(26, 47, 56, 0.06);
      border-radius: 999px;
    }

    #size-picker button {
      min-width: 36px;
      padding: 6px 10px;
      background: transparent;
      color: var(--muted);
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
    }

    #size-picker button:hover {
      background: rgba(42, 157, 143, 0.15);
      color: var(--ink);
    }

    #size-picker button.active {
      background: var(--accent);
      color: #fff;
    }

    #size-picker button.active:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    #hint {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: var(--muted);
      font-size: 0.85rem;
      background: var(--panel);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.65);
      pointer-events: none;
      opacity: 0.9;
    }

    #win-modal {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: rgba(26, 47, 56, 0.35);
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #win-modal.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #win-modal .card {
      width: min(360px, calc(100% - 40px));
      text-align: center;
      padding: 32px 28px;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transform: translateY(12px) scale(0.96);
      transition: transform 0.3s ease;
    }

    #win-modal.visible .card {
      transform: translateY(0) scale(1);
    }

    #win-modal h2 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    #win-modal p {
      color: var(--muted);
      margin-bottom: 22px;
      line-height: 1.45;
    }

    #win-modal button {
      padding: 10px 22px;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <span class="brand">Arrow Out</span>
    <span class="divider"></span>
    <span id="remaining">Remaining: <strong>0</strong></span>
    <span class="divider"></span>
    <div id="size-picker" role="group" aria-label="Cube size">
      <button type="button" data-size="3" class="active" aria-pressed="true" title="3×3×3">3³</button>
      <button type="button" data-size="4" aria-pressed="false" title="4×4×4">4³</button>
      <button type="button" data-size="5" aria-pressed="false" title="5×5×5">5³</button>
    </div>
    <button type="button" id="reset-btn">Reset</button>
  </div>

  <div id="hint">Drag to orbit · Click an arrow to remove it</div>

  <div id="win-modal" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <div class="card">
      <h2 id="win-title">Board cleared!</h2>
      <p>Every arrow found its way out. Ready for another puzzle?</p>
      <button type="button" id="play-again-btn">Play Again</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import gsap from "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js";

    const CELL = 1.15;
    const BLOCK_SIZE = 0.78;
    const ALLOWED_SIZES = [3, 4, 5];
    const DIRS = [
      new THREE.Vector3(1, 0, 0),
      new THREE.Vector3(-1, 0, 0),
      new THREE.Vector3(0, 1, 0),
      new THREE.Vector3(0, -1, 0),
      new THREE.Vector3(0, 0, 1),
      new THREE.Vector3(0, 0, -1),
    ];

    const DIR_COLORS = {
      "1,0,0": 0x7ec8e3,
      "-1,0,0": 0xf4a261,
      "0,1,0": 0x82c91e,
      "0,-1,0": 0xffd166,
      "0,0,1": 0x64b5f6,
      "0,0,-1": 0xef9a9a,
    };

    const appEl = document.getElementById("app");
    const remainingEl = document.querySelector("#remaining strong");
    const resetBtn = document.getElementById("reset-btn");
    const playAgainBtn = document.getElementById("play-again-btn");
    const winModal = document.getElementById("win-modal");
    const sizePicker = document.getElementById("size-picker");

    function parseSizeParam() {
      const raw = new URLSearchParams(window.location.search).get("size");
      const n = raw == null || raw === "" ? NaN : Number(raw);
      if (!Number.isFinite(n)) return 3;
      const rounded = Math.floor(n);
      return ALLOWED_SIZES.includes(rounded) ? rounded : 3;
    }

    let SIZE = parseSizeParam();

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.shadowMap.enabled = true;
    appEl.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);

    function frameCameraForSize() {
      const extent = SIZE * CELL;
      const dist = extent * 1.85;
      camera.position.set(dist * 0.72, dist * 0.58, dist * 0.8);
      controls.minDistance = Math.max(3, extent * 0.9);
      controls.maxDistance = Math.max(14, extent * 4);
      controls.update();
    }

    frameCameraForSize();

    scene.add(new THREE.AmbientLight(0xffffff, 0.72));
    const keyLight = new THREE.DirectionalLight(0xffffff, 0.85);
    keyLight.position.set(4, 7, 3);
    keyLight.castShadow = true;
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xd6f0ff, 0.55);
    fillLight.position.set(-5, -2, -4);
    scene.add(fillLight);

    const boardRoot = new THREE.Group();
    scene.add(boardRoot);

    /** @type {Map<string, {x:number,y:number,z:number,dir:THREE.Vector3,mesh:THREE.Group,busy:boolean,baseColor:number,id:number}>} */
    const grid = new Map();
    let generationId = 0;
    let blockIdSeq = 0;

    function key(x, y, z) {
      return `${x},${y},${z}`;
    }

    function dirKey(dir) {
      return `${dir.x},${dir.y},${dir.z}`;
    }

    function worldPos(x, y, z) {
      const c = (SIZE - 1) / 2;
      return new THREE.Vector3((x - c) * CELL, (y - c) * CELL, (z - c) * CELL);
    }

    function isInside(x, y, z) {
      return x >= 0 && x < SIZE && y >= 0 && y < SIZE && z >= 0 && z < SIZE;
    }

    function pathClearOn(map, x, y, z, dir) {
      let cx = x + dir.x;
      let cy = y + dir.y;
      let cz = z + dir.z;
      while (isInside(cx, cy, cz)) {
        if (map.has(key(cx, cy, cz))) return false;
        cx += dir.x;
        cy += dir.y;
        cz += dir.z;
      }
      return true;
    }

    function pathClearFrom(x, y, z, dir) {
      return pathClearOn(grid, x, y, z, dir);
    }

    /**
     * Reverse generation: insert blocks as if they flew in from outside.
     * A reverse insert at P with direction D is valid when the path from
     * outside along D into P is clear (same as a forward escape path).
     */
    function clearBoard() {
      generationId += 1;
      for (const block of grid.values()) {
        gsap.killTweensOf(block.mesh.position);
        gsap.killTweensOf(block.mesh.scale);
        if (block.mesh.userData.bodyMat) {
          gsap.killTweensOf(block.mesh.userData.bodyMat.color);
        }
      }
      grid.clear();
      while (boardRoot.children.length) {
        const child = boardRoot.children[0];
        boardRoot.remove(child);
        disposeObject(child);
      }
    }

    function getTargetCount() {
      const capacity = SIZE * SIZE * SIZE;
      const params = new URLSearchParams(window.location.search);
      const rawCount = params.get("count");
      const requested = rawCount == null || rawCount === "" ? NaN : Number(rawCount);
      return Number.isFinite(requested) && requested > 0
        ? Math.min(capacity, Math.max(1, Math.floor(requested)))
        : capacity;
    }

    /**
     * Build a full logical layout without creating meshes (fast enough for
     * backtracking on 5×5×5). Returns an array of {x,y,z,dir} or null.
     */
    function buildLayout(targetCount) {
      /** @type {Map<string, THREE.Vector3>} */
      const map = new Map();
      /** @type {{x:number,y:number,z:number,dir:THREE.Vector3}[]} */
      const history = [];
      const cells = [];
      for (let x = 0; x < SIZE; x += 1) {
        for (let y = 0; y < SIZE; y += 1) {
          for (let z = 0; z < SIZE; z += 1) {
            cells.push({ x, y, z });
          }
        }
      }

      let attempts = 0;
      const maxAttempts = 4000 * SIZE;
      let peak = 0;
      let sincePeak = 0;

      while (map.size < targetCount && attempts < maxAttempts) {
        attempts += 1;

        if (map.size > peak) {
          peak = map.size;
          sincePeak = 0;
        } else {
          sincePeak += 1;
          // Stuck oscillating — restart is cheaper than endless undo/redo.
          if (sincePeak > 800) return null;
        }

        const empty = cells.filter((c) => !map.has(key(c.x, c.y, c.z)));
        if (!empty.length) break;

        const candidates = [];
        for (const cell of empty) {
          for (const baseDir of DIRS) {
            if (pathClearOn(map, cell.x, cell.y, cell.z, baseDir)) {
              candidates.push({ cell, dir: baseDir });
            }
          }
        }

        if (!candidates.length) {
          const undo = Math.min(history.length, 1 + Math.floor(Math.random() * 5));
          if (!undo) return null;
          for (let i = 0; i < undo; i += 1) {
            const prev = history.pop();
            if (!prev) break;
            map.delete(key(prev.x, prev.y, prev.z));
          }
          continue;
        }

        // Prefer more-constrained empty cells (fewer clear dirs) to reduce dead-ends.
        const dirCount = new Map();
        for (const c of candidates) {
          const k = key(c.cell.x, c.cell.y, c.cell.z);
          dirCount.set(k, (dirCount.get(k) || 0) + 1);
        }
        let bestScore = Infinity;
        const scored = [];
        for (const c of candidates) {
          const score = dirCount.get(key(c.cell.x, c.cell.y, c.cell.z)) || 6;
          if (score < bestScore) bestScore = score;
          scored.push({ c, score });
        }
        const pool = scored.filter((s) => s.score <= bestScore + 1).map((s) => s.c);
        const pick = pool[Math.floor(Math.random() * pool.length)];
        const dir = pick.dir.clone();
        map.set(key(pick.cell.x, pick.cell.y, pick.cell.z), dir);
        history.push({ x: pick.cell.x, y: pick.cell.y, z: pick.cell.z, dir });
      }

      if (map.size !== targetCount) return null;
      return history;
    }

    function tryBuildPuzzle() {
      const targetCount = getTargetCount();
      const layout = buildLayout(targetCount);
      if (!layout) return false;

      clearBoard();
      for (const item of layout) {
        placeBlock(item.x, item.y, item.z, item.dir);
      }
      return grid.size === targetCount;
    }

    function generatePuzzle() {
      const retries = Math.max(60, SIZE * 40);
      let ok = false;
      for (let i = 0; i < retries; i += 1) {
        if (tryBuildPuzzle()) {
          ok = true;
          break;
        }
      }
      if (!ok) {
        // Last resort: accept whatever the best single attempt produced.
        clearBoard();
        const targetCount = getTargetCount();
        const layout = buildLayout(targetCount);
        if (layout) {
          for (const item of layout) placeBlock(item.x, item.y, item.z, item.dir);
        } else {
          // Extremely rare: place a partial greedy layout without backtracking budget.
          const map = new Map();
          const cells = [];
          for (let x = 0; x < SIZE; x += 1) {
            for (let y = 0; y < SIZE; y += 1) {
              for (let z = 0; z < SIZE; z += 1) cells.push({ x, y, z });
            }
          }
          for (let a = 0; a < targetCount * 20; a += 1) {
            if (map.size >= targetCount) break;
            const empty = cells.filter((c) => !map.has(key(c.x, c.y, c.z)));
            const candidates = [];
            for (const cell of empty) {
              for (const baseDir of DIRS) {
                if (pathClearOn(map, cell.x, cell.y, cell.z, baseDir)) {
                  candidates.push({ cell, dir: baseDir.clone() });
                }
              }
            }
            if (!candidates.length) break;
            const pick = candidates[Math.floor(Math.random() * candidates.length)];
            map.set(key(pick.cell.x, pick.cell.y, pick.cell.z), pick.dir);
            placeBlock(pick.cell.x, pick.cell.y, pick.cell.z, pick.dir);
          }
        }
      }
      updateRemaining();
      hideWin();
    }

    function placeBlock(x, y, z, dir) {
      const mesh = createBlockMesh(dir);
      const pos = worldPos(x, y, z);
      mesh.position.copy(pos);
      const id = (blockIdSeq += 1);
      mesh.userData.gridKey = key(x, y, z);
      mesh.userData.blockId = id;
      boardRoot.add(mesh);

      grid.set(key(x, y, z), {
        x,
        y,
        z,
        dir: dir.clone(),
        mesh,
        busy: false,
        baseColor: DIR_COLORS[dirKey(dir)] ?? 0xa8dadc,
        id,
      });
    }

    function createBlockMesh(dir) {
      const group = new THREE.Group();
      const color = DIR_COLORS[dirKey(dir)] ?? 0xa8dadc;

      const bodyMat = new THREE.MeshStandardMaterial({
        color,
        roughness: 0.45,
        metalness: 0.05,
        flatShading: false,
      });
      const accentMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.35,
        metalness: 0.08,
      });

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE),
        bodyMat
      );
      body.castShadow = true;
      body.receiveShadow = true;
      group.add(body);

      // Larger invisible pick target so clicks register reliably
      const hit = new THREE.Mesh(
        new THREE.BoxGeometry(BLOCK_SIZE * 1.15, BLOCK_SIZE * 1.15, BLOCK_SIZE * 1.15),
        new THREE.MeshBasicMaterial({
          transparent: true,
          opacity: 0,
          depthWrite: false,
        })
      );
      hit.userData.isHitProxy = true;
      group.add(hit);

      const plate = new THREE.Mesh(
        new THREE.BoxGeometry(BLOCK_SIZE * 0.72, BLOCK_SIZE * 0.72, BLOCK_SIZE * 0.06),
        accentMat
      );
      plate.position.copy(dir.clone().multiplyScalar(BLOCK_SIZE * 0.5));
      alignToDirection(plate, dir);
      group.add(plate);

      const cone = new THREE.Mesh(
        new THREE.ConeGeometry(0.18, 0.34, 16),
        accentMat.clone()
      );
      cone.position.copy(dir.clone().multiplyScalar(BLOCK_SIZE * 0.52 + 0.12));
      alignConeToDirection(cone, dir);
      cone.castShadow = true;
      group.add(cone);

      group.userData.materials = [bodyMat, accentMat, cone.material, hit.material];
      group.userData.bodyMat = bodyMat;
      return group;
    }

    function alignToDirection(obj, dir) {
      const q = new THREE.Quaternion();
      q.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir.clone().normalize());
      obj.quaternion.copy(q);
    }

    function alignConeToDirection(cone, dir) {
      // ConeGeometry points +Y by default
      const q = new THREE.Quaternion();
      q.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
      cone.quaternion.copy(q);
    }

    function disposeObject(obj) {
      obj.traverse((child) => {
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
          if (Array.isArray(child.material)) {
            child.material.forEach((m) => m.dispose());
          } else {
            child.material.dispose();
          }
        }
      });
    }

    function updateRemaining() {
      remainingEl.textContent = String(grid.size);
    }

    function showWin() {
      winModal.classList.add("visible");
    }

    function hideWin() {
      winModal.classList.remove("visible");
    }

    // --- Input: click vs drag ---
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerDown = null;

    function setPointerFromEvent(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function onPointerDown(event) {
      if (event.button !== 0) return;
      pointerDown = { x: event.clientX, y: event.clientY };
    }

    function findBlockFromHit(hitObject) {
      let obj = hitObject;
      while (obj && obj.parent !== boardRoot) obj = obj.parent;
      if (!obj || !obj.userData.gridKey) return null;
      return grid.get(obj.userData.gridKey) || null;
    }

    function onPointerUp(event) {
      if (event.button !== 0 || !pointerDown) return;
      const dx = event.clientX - pointerDown.x;
      const dy = event.clientY - pointerDown.y;
      pointerDown = null;

      // Distinguish clicks from orbit-drags (plan: < 5px; use 5 as specified)
      if (Math.hypot(dx, dy) >= 5) return;
      if (winModal.classList.contains("visible")) return;

      setPointerFromEvent(event);
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(boardRoot.children, true);
      for (const hit of hits) {
        const block = findBlockFromHit(hit.object);
        if (!block || block.busy) continue;
        tryRemove(block);
        return;
      }
    }

    function tryRemove(block) {
      if (pathClearFrom(block.x, block.y, block.z, block.dir)) {
        escapeBlock(block);
      } else {
        errorBlock(block);
      }
    }

    function escapeBlock(block) {
      if (block.busy) return;
      block.busy = true;
      const mesh = block.mesh;
      const gen = generationId;
      const blockId = block.id;
      const gridKey = key(block.x, block.y, block.z);

      // Remove from logical grid immediately so paths update and Reset cannot race
      grid.delete(gridKey);
      updateRemaining();
      const clearedBoard = grid.size === 0;

      // Prevent this departing mesh from eating later raycasts
      mesh.traverse((child) => {
        child.raycast = () => {};
      });

      const end = mesh.position.clone().add(
        block.dir.clone().multiplyScalar(SIZE * CELL * 2.5)
      );

      gsap.to(mesh.position, {
        x: end.x,
        y: end.y,
        z: end.z,
        duration: 0.55,
        ease: "power2.in",
        onComplete: () => {
          if (gen !== generationId || mesh.userData.blockId !== blockId) return;
          if (mesh.parent) boardRoot.remove(mesh);
          disposeObject(mesh);
          if (clearedBoard && gen === generationId) showWin();
        },
      });

      gsap.to(mesh.scale, {
        x: 0.7,
        y: 0.7,
        z: 0.7,
        duration: 0.55,
        ease: "power1.in",
      });
    }

    function errorBlock(block) {
      block.busy = true;
      const mesh = block.mesh;
      const origin = mesh.position.clone();
      const nudge = block.dir.clone().multiplyScalar(0.1);
      const bodyMat = mesh.userData.bodyMat;
      const original = bodyMat.color.getHex();
      const gen = generationId;
      const blockId = block.id;

      bodyMat.color.setHex(0xe76f51);

      const tl = gsap.timeline({
        onComplete: () => {
          if (gen !== generationId || mesh.userData.blockId !== blockId) return;
          mesh.position.copy(origin);
          bodyMat.color.setHex(original);
          block.busy = false;
        },
      });

      tl.to(mesh.position, {
        x: origin.x + nudge.x,
        y: origin.y + nudge.y,
        z: origin.z + nudge.z,
        duration: 0.1,
        ease: "power1.out",
      });

      const perp =
        Math.abs(block.dir.y) < 0.5
          ? new THREE.Vector3(0, 1, 0)
          : new THREE.Vector3(1, 0, 0);
      const side = new THREE.Vector3()
        .crossVectors(block.dir, perp)
        .normalize()
        .multiplyScalar(0.08);

      tl.to(mesh.position, {
        x: origin.x + nudge.x + side.x,
        y: origin.y + nudge.y + side.y,
        z: origin.z + nudge.z + side.z,
        duration: 0.06,
        yoyo: true,
        repeat: 5,
        ease: "power1.inOut",
      });

      tl.to(mesh.position, {
        x: origin.x,
        y: origin.y,
        z: origin.z,
        duration: 0.16,
        ease: "power2.out",
      });

      tl.to(
        {},
        {
          duration: 0.2,
          onStart: () => {
            gsap.to(bodyMat.color, {
              r: ((original >> 16) & 255) / 255,
              g: ((original >> 8) & 255) / 255,
              b: (original & 255) / 255,
              duration: 0.25,
              ease: "power1.out",
            });
          },
        },
        "<"
      );
    }

    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    // Auto-solve helper for demos / debugging (always-legal reverse order not needed:
    // repeatedly remove any currently free block).
    function autoSolveStep() {
      for (const block of grid.values()) {
        if (!block.busy && pathClearFrom(block.x, block.y, block.z, block.dir)) {
          escapeBlock(block);
          return true;
        }
      }
      return false;
    }

    window.__arrowOut = {
      reset: () => generatePuzzle(),
      remaining: () => grid.size,
      get size() {
        return SIZE;
      },
      setSize: (next) => setSize(next),
      autoSolveStep,
      autoSolveAll: async () => {
        while (grid.size > 0) {
          if (!autoSolveStep()) break;
          await new Promise((r) => setTimeout(r, 600));
        }
      },
    };

    function syncSizeUrl() {
      const url = new URL(window.location.href);
      if (SIZE === 3) url.searchParams.delete("size");
      else url.searchParams.set("size", String(SIZE));
      history.replaceState(null, "", url);
    }

    function syncSizeButtons() {
      for (const btn of sizePicker.querySelectorAll("button[data-size]")) {
        const n = Number(btn.dataset.size);
        const active = n === SIZE;
        btn.classList.toggle("active", active);
        btn.setAttribute("aria-pressed", active ? "true" : "false");
      }
    }

    function setSize(next) {
      const n = Math.floor(Number(next));
      if (!ALLOWED_SIZES.includes(n) || n === SIZE) return false;
      SIZE = n;
      syncSizeButtons();
      syncSizeUrl();
      frameCameraForSize();
      generatePuzzle();
      return true;
    }

    renderer.domElement.addEventListener("pointerdown", onPointerDown);
    renderer.domElement.addEventListener("pointerup", onPointerUp);
    renderer.domElement.addEventListener("pointercancel", () => {
      pointerDown = null;
    });
    window.addEventListener("resize", onResize);
    resetBtn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      generatePuzzle();
      remainingEl.animate(
        [{ transform: "scale(1)" }, { transform: "scale(1.2)" }, { transform: "scale(1)" }],
        { duration: 280 }
      );
    });
    playAgainBtn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      generatePuzzle();
    });
    sizePicker.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-size]");
      if (!btn) return;
      e.preventDefault();
      e.stopPropagation();
      setSize(btn.dataset.size);
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "r" || e.key === "R") generatePuzzle();
    });

    syncSizeButtons();
    onResize();
    generatePuzzle();
    animate();
  </script>
</body>
</html>
