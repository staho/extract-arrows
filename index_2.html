<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arrow Out — Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #d8efe8;
      --bg1: #c5e4f5;
      --ink: #1a2f38;
      --muted: #4a6670;
      --panel: rgba(255, 255, 255, 0.72);
      --accent: #2a9d8f;
      --shadow: 0 12px 40px rgba(26, 47, 56, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Outfit", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 800px at 15% 10%, #e8f8f3 0%, transparent 55%),
        radial-gradient(1000px 700px at 90% 80%, #d0ebf8 0%, transparent 50%),
        linear-gradient(145deg, var(--bg0), var(--bg1));
    }

    #app {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    #hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 12px 18px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 999px;
      box-shadow: var(--shadow);
      user-select: none;
      pointer-events: none;
    }

    #hud .brand {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }

    #hint {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: var(--muted);
      font-size: 0.85rem;
      background: var(--panel);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.65);
      pointer-events: none;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <span class="brand">Arrow Out — Grid</span>
  </div>

  <div id="hint">Drag to orbit · Scroll to zoom</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import gsap from "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js";

    const GRID = 10;
    const CELL = 1.15;
    const HALF = GRID / 2;

    const appEl = document.getElementById("app");

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
    camera.position.set(14, 11, 16);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    appEl.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 8;
    controls.maxDistance = 40;
    controls.target.set(0, 0, 0);
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 0.72));
    const keyLight = new THREE.DirectionalLight(0xffffff, 0.85);
    keyLight.position.set(8, 14, 6);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xd6f0ff, 0.55);
    fillLight.position.set(-10, -4, -8);
    scene.add(fillLight);

    const skeletonRoot = new THREE.Group();
    scene.add(skeletonRoot);

    function buildLattice(size, cell) {
      const positions = [];
      const half = size / 2;
      const min = -half * cell;
      const max = half * cell;

      // Lines parallel to X (vary y, z)
      for (let iy = 0; iy <= size; iy++) {
        const y = min + iy * cell;
        for (let iz = 0; iz <= size; iz++) {
          const z = min + iz * cell;
          positions.push(min, y, z, max, y, z);
        }
      }

      // Lines parallel to Y (vary x, z)
      for (let ix = 0; ix <= size; ix++) {
        const x = min + ix * cell;
        for (let iz = 0; iz <= size; iz++) {
          const z = min + iz * cell;
          positions.push(x, min, z, x, max, z);
        }
      }

      // Lines parallel to Z (vary x, y)
      for (let ix = 0; ix <= size; ix++) {
        const x = min + ix * cell;
        for (let iy = 0; iy <= size; iy++) {
          const y = min + iy * cell;
          positions.push(x, y, min, x, y, max);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(positions, 3)
      );

      const material = new THREE.LineBasicMaterial({
        color: 0x4a6670,
        transparent: true,
        opacity: 0.72,
      });

      return new THREE.LineSegments(geometry, material);
    }

    const lattice = buildLattice(GRID, CELL);
    skeletonRoot.add(lattice);

    // Subtle idle hover so the skeleton feels suspended
    gsap.to(skeletonRoot.position, {
      y: 0.14,
      duration: 2.8,
      ease: "sine.inOut",
      yoyo: true,
      repeat: -1,
    });
    gsap.to(skeletonRoot.rotation, {
      y: 0.045,
      duration: 4.2,
      ease: "sine.inOut",
      yoyo: true,
      repeat: -1,
    });

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }

    window.addEventListener("resize", resize);
    resize();

    function tick() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }

    tick();
  </script>
</body>
</html>
