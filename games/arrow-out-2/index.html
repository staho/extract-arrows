<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arrow Out — Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #d8efe8;
      --bg1: #c5e4f5;
      --ink: #1a2f38;
      --muted: #4a6670;
      --panel: rgba(255, 255, 255, 0.72);
      --accent: #2a9d8f;
      --shadow: 0 12px 40px rgba(26, 47, 56, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Outfit", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 800px at 15% 10%, #e8f8f3 0%, transparent 55%),
        radial-gradient(1000px 700px at 90% 80%, #d0ebf8 0%, transparent 50%),
        linear-gradient(145deg, var(--bg0), var(--bg1));
    }

    #app {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    #hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 12px 18px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 999px;
      box-shadow: var(--shadow);
      user-select: none;
      pointer-events: none;
    }

    #hud .brand {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }

    #hint {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: var(--muted);
      font-size: 0.85rem;
      background: var(--panel);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.65);
      pointer-events: none;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <span class="brand">Arrow Out — Grid</span>
  </div>

  <div id="hint">Drag to orbit · Scroll to zoom</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import gsap from "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js";

    const GRID = 10;
    const CELL = 1.15;
    const HALF = GRID / 2;

    const appEl = document.getElementById("app");

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
    camera.position.set(14, 11, 16);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    appEl.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 8;
    controls.maxDistance = 40;
    controls.target.set(0, 0, 0);
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 0.72));
    const keyLight = new THREE.DirectionalLight(0xffffff, 0.85);
    keyLight.position.set(8, 14, 6);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xd6f0ff, 0.55);
    fillLight.position.set(-10, -4, -8);
    scene.add(fillLight);

    const skeletonRoot = new THREE.Group();
    scene.add(skeletonRoot);

    function buildLattice(size, cell) {
      const positions = [];
      const half = size / 2;
      const min = -half * cell;
      const max = half * cell;

      // Lines parallel to X (vary y, z)
      for (let iy = 0; iy <= size; iy++) {
        const y = min + iy * cell;
        for (let iz = 0; iz <= size; iz++) {
          const z = min + iz * cell;
          positions.push(min, y, z, max, y, z);
        }
      }

      // Lines parallel to Y (vary x, z)
      for (let ix = 0; ix <= size; ix++) {
        const x = min + ix * cell;
        for (let iz = 0; iz <= size; iz++) {
          const z = min + iz * cell;
          positions.push(x, min, z, x, max, z);
        }
      }

      // Lines parallel to Z (vary x, y)
      for (let ix = 0; ix <= size; ix++) {
        const x = min + ix * cell;
        for (let iy = 0; iy <= size; iy++) {
          const y = min + iy * cell;
          positions.push(x, y, min, x, y, max);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(positions, 3)
      );

      const material = new THREE.LineBasicMaterial({
        color: 0x4a6670,
        transparent: true,
        opacity: 0.72,
      });

      return new THREE.LineSegments(geometry, material);
    }

    const lattice = buildLattice(GRID, CELL);
    skeletonRoot.add(lattice);

    // Vibrant palette shared across arrows. Colours repeat (palette kept small);
    // an arrow's colour is just cosmetic and comes from the JSON.
    const PALETTE = [
      0xff3b3b, // red
      0xff9f1c, // orange
      0xffd23f, // yellow
      0x2ec4b6, // teal
      0x3a86ff, // blue
      0x8338ec, // purple
    ];

    const cellMaterials = PALETTE.map(
      (color) =>
        new THREE.MeshStandardMaterial({
          color,
          roughness: 0.45,
          metalness: 0.1,
        })
    );

    const cubeEdge = CELL * 0.32;
    const cubeGeometry = new THREE.BoxGeometry(cubeEdge, cubeEdge, cubeEdge);
    const cellMin = -HALF * CELL;

    const cellCenter = (ix, iy, iz) =>
      new THREE.Vector3(
        cellMin + (ix + 0.5) * CELL,
        cellMin + (iy + 0.5) * CELL,
        cellMin + (iz + 0.5) * CELL
      );

    // Bars that join consecutive cells of an arrow: the cross section matches the
    // cube's sides, only the length spans the gap between two adjacent cube faces.
    const AXES = [
      [1, 0, 0],
      [0, 1, 0],
      [0, 0, 1],
    ];
    const connectorLength = CELL - cubeEdge;
    const connectorGeoms = AXES.map(([dx, dy, dz]) => {
      const dims = [cubeEdge, cubeEdge, cubeEdge];
      if (dx) dims[0] = connectorLength;
      if (dy) dims[1] = connectorLength;
      if (dz) dims[2] = connectorLength;
      return new THREE.BoxGeometry(dims[0], dims[1], dims[2]);
    });

    // Arrowhead cone (points +Y by default; reoriented per arrow head).
    const coneHeight = cubeEdge * 1.4;
    const coneRadius = cubeEdge * 0.62;
    const coneGeometry = new THREE.ConeGeometry(coneRadius, coneHeight, 16);
    const CONE_UP = new THREE.Vector3(0, 1, 0);

    // Index (0/1/2) of the axis along which two adjacent cells differ.
    function axisIndex(a, b) {
      if (a[0] !== b[0]) return 0;
      if (a[1] !== b[1]) return 1;
      return 2;
    }

    function addConnector(a, b, material) {
      const ax = axisIndex(a, b);
      const connector = new THREE.Mesh(connectorGeoms[ax], material);
      connector.position.set(
        cellMin + ((a[0] + b[0]) / 2 + 0.5) * CELL,
        cellMin + ((a[1] + b[1]) / 2 + 0.5) * CELL,
        cellMin + ((a[2] + b[2]) / 2 + 0.5) * CELL
      );
      skeletonRoot.add(connector);
    }

    function addArrow(arrow) {
      const cells = arrow.cells;
      if (!cells || cells.length === 0) return;
      const material = cellMaterials[arrow.color % cellMaterials.length];

      for (const [ix, iy, iz] of cells) {
        const cube = new THREE.Mesh(cubeGeometry, material);
        cube.position.copy(cellCenter(ix, iy, iz));
        skeletonRoot.add(cube);
      }

      for (let i = 0; i < cells.length - 1; i++) {
        addConnector(cells[i], cells[i + 1], material);
      }

      // Arrowhead: cells are stored head-first, so it points from the head away
      // from the body (cells[0] - cells[1]) and sits just beyond the head cube.
      if (cells.length >= 2) {
        const [hx, hy, hz] = cells[0];
        const [nx, ny, nz] = cells[1];
        const dir = new THREE.Vector3(hx - nx, hy - ny, hz - nz).normalize();
        const cone = new THREE.Mesh(coneGeometry, material);
        cone.quaternion.setFromUnitVectors(CONE_UP, dir);
        cone.position
          .copy(cellCenter(hx, hy, hz))
          .addScaledVector(dir, cubeEdge / 2 + coneHeight / 2);
        skeletonRoot.add(cone);
      }
    }

    // Load the arrow set from a static JSON file and render it. Generation lives
    // in tools/generate-arrows.mjs; this page only draws what the file describes.
    try {
      const res = await fetch("./arrows.json", { cache: "no-cache" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.grid && data.grid !== GRID) {
        console.warn(
          `arrows.json grid (${data.grid}) differs from lattice grid (${GRID}); ` +
            "positions may not align with the wireframe."
        );
      }
      for (const arrow of data.arrows) addArrow(arrow);
    } catch (err) {
      console.error("Failed to load arrows.json:", err);
    }

    // Subtle idle hover so the skeleton feels suspended
    gsap.to(skeletonRoot.position, {
      y: 0.14,
      duration: 2.8,
      ease: "sine.inOut",
      yoyo: true,
      repeat: -1,
    });
    gsap.to(skeletonRoot.rotation, {
      y: 0.045,
      duration: 4.2,
      ease: "sine.inOut",
      yoyo: true,
      repeat: -1,
    });

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }

    window.addEventListener("resize", resize);
    resize();

    function tick() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }

    tick();
  </script>
</body>
</html>
