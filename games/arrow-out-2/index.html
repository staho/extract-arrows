<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arrow Out — Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #d8efe8;
      --bg1: #c5e4f5;
      --ink: #1a2f38;
      --muted: #4a6670;
      --panel: rgba(255, 255, 255, 0.72);
      --accent: #2a9d8f;
      --accent-hover: #238b7e;
      --shadow: 0 12px 40px rgba(26, 47, 56, 0.12);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Outfit", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 800px at 15% 10%, #e8f8f3 0%, transparent 55%),
        radial-gradient(1000px 700px at 90% 80%, #d0ebf8 0%, transparent 50%),
        linear-gradient(145deg, var(--bg0), var(--bg1));
    }

    #app {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    #hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px 18px;
      max-width: calc(100% - 24px);
      padding: 12px 18px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 999px;
      box-shadow: var(--shadow);
      user-select: none;
      pointer-events: auto;
    }

    #reset-btn {
      position: relative;
      z-index: 11;
      min-width: 88px;
    }

    #hud .brand {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }

    #hud .divider {
      width: 1px;
      height: 22px;
      background: rgba(26, 47, 56, 0.15);
    }

    #remaining {
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 500;
    }

    #remaining strong {
      color: var(--ink);
      font-weight: 700;
    }

    #lives {
      display: flex;
      align-items: center;
      gap: 1px;
      font-size: 1.05rem;
      line-height: 1;
    }

    #lives .heart {
      width: 1.15em;
      text-align: center;
    }

    #lives .heart.spent {
      opacity: 0.4;
      filter: grayscale(0.35);
    }

    #timer {
      min-width: 3.2rem;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 0.95rem;
      text-align: center;
    }

    #day-nav {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #day-nav[hidden] {
      display: none;
    }

    #day-label {
      min-width: 4.8rem;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 600;
    }

    #day-nav button {
      min-width: 34px;
      padding: 6px 10px;
      background: rgba(42, 157, 143, 0.14);
      color: var(--ink);
    }

    #day-nav button:hover:not(:disabled) {
      background: rgba(42, 157, 143, 0.26);
    }

    #day-nav button:disabled {
      opacity: 0.35;
      cursor: default;
      transform: none;
    }

    #day-nav button:focus-visible,
    #reset-btn:focus-visible,
    #play-again-btn:focus-visible,
    #score-submit:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (max-width: 640px) {
      #hud {
        flex-wrap: nowrap;
        gap: 8px;
        padding: 10px 12px;
      }

      #hud .brand,
      #hud .divider {
        display: none;
      }

      #remaining {
        font-size: 0;
      }

      #remaining strong {
        font-size: 0.95rem;
      }

      #day-label {
        min-width: 3.2rem;
        font-size: 0.9rem;
      }

      #reset-btn {
        min-width: 0;
        padding: 8px 14px;
      }

      #lives {
        font-size: 0.95rem;
      }

      #timer {
        min-width: 2.6rem;
        font-size: 0.9rem;
      }
    }

    button {
      font-family: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      border: none;
      border-radius: 999px;
      padding: 8px 16px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      transform: scale(0.97);
    }

    #hint {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: var(--muted);
      font-size: 0.85rem;
      background: var(--panel);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.65);
      pointer-events: none;
      opacity: 0.9;
    }

    #result-modal {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: rgba(26, 47, 56, 0.35);
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #result-modal.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #result-modal .card {
      width: min(400px, calc(100% - 40px));
      max-height: calc(100% - 40px);
      overflow: auto;
      text-align: center;
      padding: 28px 24px 24px;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transform: translateY(12px) scale(0.96);
      transition: transform 0.3s ease;
    }

    #result-modal.visible .card {
      transform: translateY(0) scale(1);
    }

    #result-modal h2 {
      font-size: 1.5rem;
      margin-bottom: 6px;
    }

    #result-summary {
      color: var(--muted);
      margin-bottom: 14px;
      line-height: 1.45;
    }

    #result-stats {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    #result-stats strong {
      color: var(--ink);
      font-weight: 700;
    }

    #score-form {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    #score-form[hidden] {
      display: none;
    }

    #score-name {
      flex: 1;
      min-width: 0;
      font-family: inherit;
      font-size: 0.9rem;
      padding: 8px 12px;
      border: 1px solid rgba(26, 47, 56, 0.18);
      border-radius: 999px;
      color: var(--ink);
      background: #fff;
    }

    #score-name:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    #score-submit {
      padding: 8px 16px;
    }

    #score-submit:disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
    }

    #result-rank {
      color: var(--ink);
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    #result-rank[hidden] {
      display: none;
    }

    #result-rank.error {
      color: #c45c3e;
      font-weight: 500;
    }

    #leaderboard {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
      margin: 4px 0 18px;
    }

    #leaderboard th {
      color: var(--muted);
      font-weight: 600;
      padding: 6px 8px;
      border-bottom: 1px solid rgba(26, 47, 56, 0.12);
    }

    #leaderboard td {
      padding: 7px 8px;
      border-bottom: 1px solid rgba(26, 47, 56, 0.08);
    }

    #leaderboard th:first-child,
    #leaderboard td:first-child,
    #leaderboard th:last-child,
    #leaderboard td:last-child,
    #leaderboard th:nth-child(3),
    #leaderboard td:nth-child(3) {
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    #leaderboard .empty {
      text-align: center;
      color: var(--muted);
      padding: 14px 8px;
    }

    #result-modal #play-again-btn {
      padding: 10px 22px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <span class="brand">Arrow Out — Grid</span>
    <span class="divider"></span>
    <nav id="day-nav" hidden aria-label="Puzzle archive">
      <button type="button" id="day-prev" aria-label="Previous puzzle">‹</button>
      <span id="day-label">Today</span>
      <button type="button" id="day-next" aria-label="Next puzzle">›</button>
    </nav>
    <span class="divider" id="day-divider" hidden></span>
    <span id="lives" aria-label="3 lives remaining">
      <span class="heart" aria-hidden="true">❤️</span>
      <span class="heart" aria-hidden="true">❤️</span>
      <span class="heart" aria-hidden="true">❤️</span>
    </span>
    <span id="timer">0:00</span>
    <span id="remaining">Remaining: <strong>0</strong></span>
    <button type="button" id="reset-btn">Reset</button>
  </div>

  <div id="hint">Drag to orbit · Click an arrow to remove it</div>

  <div id="result-modal" role="dialog" aria-modal="true" aria-labelledby="result-title">
    <div class="card">
      <h2 id="result-title">Board cleared!</h2>
      <p id="result-summary">Every arrow found its way out.</p>
      <div id="result-stats">
        <span>Time <strong id="result-time">0:00</strong></span>
        <span>Lives <strong id="result-lives">❤️❤️❤️</strong></span>
      </div>
      <form id="score-form" hidden>
        <label class="sr-only" for="score-name">Nickname</label>
        <input
          id="score-name"
          name="name"
          type="text"
          maxlength="16"
          autocomplete="nickname"
          placeholder="Your name"
          spellcheck="false"
        />
        <button type="submit" id="score-submit">Submit</button>
      </form>
      <p id="result-rank" hidden></p>
      <table id="leaderboard">
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Time</th>
            <th>♥</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
      <button type="button" id="play-again-btn">Play Again</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import gsap from "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js";

    const GRID = 10;
    const CELL = 1.15;
    const HALF = GRID / 2;
    const MAX_LIVES = 3;
    const NAME_KEY = "arrow-out-2-name";

    const params = new URLSearchParams(window.location.search);
    const rawDev = params.get("dev");
    const DEV_MODE = params.has("dev") && rawDev !== "0" && rawDev !== "false";

    const appEl = document.getElementById("app");
    const remainingEl = document.querySelector("#remaining strong");
    const resetBtn = document.getElementById("reset-btn");
    const playAgainBtn = document.getElementById("play-again-btn");
    const resultModal = document.getElementById("result-modal");
    const resultTitle = document.getElementById("result-title");
    const resultSummary = document.getElementById("result-summary");
    const resultTime = document.getElementById("result-time");
    const resultLives = document.getElementById("result-lives");
    const scoreForm = document.getElementById("score-form");
    const scoreName = document.getElementById("score-name");
    const scoreSubmit = document.getElementById("score-submit");
    const resultRank = document.getElementById("result-rank");
    const leaderboardBody = document.getElementById("leaderboard-body");
    const livesEl = document.getElementById("lives");
    const timerEl = document.getElementById("timer");
    const dayNav = document.getElementById("day-nav");
    const dayDivider = document.getElementById("day-divider");
    const dayPrevBtn = document.getElementById("day-prev");
    const dayNextBtn = document.getElementById("day-next");
    const dayLabel = document.getElementById("day-label");

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
    camera.position.set(14, 11, 16);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    appEl.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 8;
    controls.maxDistance = 40;
    controls.target.set(0, 0, 0);
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 0.72));
    const keyLight = new THREE.DirectionalLight(0xffffff, 0.85);
    keyLight.position.set(8, 14, 6);
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xd6f0ff, 0.55);
    fillLight.position.set(-10, -4, -8);
    scene.add(fillLight);

    const skeletonRoot = new THREE.Group();
    scene.add(skeletonRoot);

    const boardRoot = new THREE.Group();
    skeletonRoot.add(boardRoot);

    function buildLattice(size, cell) {
      const positions = [];
      const half = size / 2;
      const min = -half * cell;
      const max = half * cell;

      // Lines parallel to X (vary y, z)
      for (let iy = 0; iy <= size; iy++) {
        const y = min + iy * cell;
        for (let iz = 0; iz <= size; iz++) {
          const z = min + iz * cell;
          positions.push(min, y, z, max, y, z);
        }
      }

      // Lines parallel to Y (vary x, z)
      for (let ix = 0; ix <= size; ix++) {
        const x = min + ix * cell;
        for (let iz = 0; iz <= size; iz++) {
          const z = min + iz * cell;
          positions.push(x, min, z, x, max, z);
        }
      }

      // Lines parallel to Z (vary x, y)
      for (let ix = 0; ix <= size; ix++) {
        const x = min + ix * cell;
        for (let iy = 0; iy <= size; iy++) {
          const y = min + iy * cell;
          positions.push(x, y, min, x, y, max);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(positions, 3)
      );

      const material = new THREE.LineBasicMaterial({
        color: 0x4a6670,
        transparent: true,
        opacity: 0.72,
      });

      return new THREE.LineSegments(geometry, material);
    }

    const lattice = buildLattice(GRID, CELL);

    function setGridVisible(visible) {
      if (visible) {
        if (!lattice.parent) skeletonRoot.add(lattice);
      } else if (lattice.parent) {
        skeletonRoot.remove(lattice);
      }
    }

    setGridVisible(DEV_MODE);

    // Vibrant palette shared across arrows. Colours repeat (palette kept small);
    // an arrow's colour is just cosmetic and comes from the JSON.
    const PALETTE = [
      0xff3b3b, // red
      0xff9f1c, // orange
      0xffd23f, // yellow
      0x2ec4b6, // teal
      0x3a86ff, // blue
      0x8338ec, // purple
    ];

    const cubeEdge = CELL * 0.32;
    const cubeGeometry = new THREE.BoxGeometry(cubeEdge, cubeEdge, cubeEdge);
    const hitGeometry = new THREE.BoxGeometry(
      cubeEdge * 1.35,
      cubeEdge * 1.35,
      cubeEdge * 1.35
    );
    const hitMaterial = new THREE.MeshBasicMaterial({
      transparent: true,
      opacity: 0,
      depthWrite: false,
    });
    const cellMin = -HALF * CELL;

    const cellCenter = (ix, iy, iz) =>
      new THREE.Vector3(
        cellMin + (ix + 0.5) * CELL,
        cellMin + (iy + 0.5) * CELL,
        cellMin + (iz + 0.5) * CELL
      );

    // Unit-Z bar: scale.z is the gap between two cube faces; quaternion aims +Z
    // along the segment so connectors stay attached while a snake corners.
    const connectorGeometry = new THREE.BoxGeometry(cubeEdge, cubeEdge, 1);
    const CONN_AXIS = new THREE.Vector3(0, 0, 1);
    const _connDelta = new THREE.Vector3();

    function placeConnector(mesh, aPos, bPos) {
      _connDelta.subVectors(bPos, aPos);
      const dist = _connDelta.length();
      if (dist < cubeEdge * 0.15) {
        mesh.visible = false;
        return;
      }
      mesh.visible = true;
      mesh.position.copy(aPos).add(bPos).multiplyScalar(0.5);
      mesh.scale.set(1, 1, Math.max(dist - cubeEdge, 1e-4));
      mesh.quaternion.setFromUnitVectors(
        CONN_AXIS,
        _connDelta.multiplyScalar(1 / dist)
      );
    }

    // Square pyramid head: same cubeEdge box as a body cube. Radius is
    // center-to-vertex so a 45° yaw makes the square sides match the cube.
    const coneGeometry = new THREE.ConeGeometry(
      cubeEdge / Math.SQRT2,
      cubeEdge,
      4
    );
    coneGeometry.rotateY(Math.PI / 4);
    const CONE_UP = new THREE.Vector3(0, 1, 0);
    const SLITHER_SPEED = 14;

    function key(x, y, z) {
      return `${x},${y},${z}`;
    }

    function inBounds(x, y, z) {
      return x >= 0 && x < GRID && y >= 0 && y < GRID && z >= 0 && z < GRID;
    }

    /** @type {Map<string, Arrow>} cell key → arrow occupying that cell */
    const occ = new Map();
    /** @type {Map<number, Arrow>} */
    const arrows = new Map();
    /** @type {Set<Arrow>} extracted arrows still animating out */
    const departing = new Set();
    let arrowIdSeq = 0;
    let generationId = 0;
    let puzzleData = null;
    let lives = MAX_LIVES;
    let timeMs = 0;
    let timerStartedAt = null;
    let runOver = false;
    let submittedScore = false;

    /**
     * @typedef {{
     *   id: number,
     *   cells: number[][],
     *   dir: THREE.Vector3,
     *   mesh: THREE.Group,
     *   cubes: THREE.Mesh[],
     *   connectors: THREE.Mesh[],
     *   tweenTarget: { t: number },
     *   busy: boolean,
     *   bodyMat: THREE.MeshStandardMaterial,
     *   headMat: THREE.MeshStandardMaterial,
     *   baseColor: number,
     * }} Arrow
     */

    function tintHeadColor(hex) {
      return new THREE.Color(hex).lerp(new THREE.Color(0xffffff), 0.4);
    }

    /** World position along an arrow's snake path. `s` is in cell units. */
    function pathPoint(cells, unit, s, target) {
      const n = cells.length;
      if (s >= 0) {
        const [hx, hy, hz] = cells[0];
        return target.copy(cellCenter(hx, hy, hz)).addScaledVector(unit, s * CELL);
      }
      const bodyIndex = Math.min(-s, n - 1);
      const i0 = Math.min(Math.floor(bodyIndex), n - 2);
      const frac = bodyIndex - i0;
      const a = cells[i0];
      const b = cells[i0 + 1];
      return target.set(
        cellMin + (a[0] + 0.5) * CELL + (b[0] - a[0]) * frac * CELL,
        cellMin + (a[1] + 0.5) * CELL + (b[1] - a[1]) * frac * CELL,
        cellMin + (a[2] + 0.5) * CELL + (b[2] - a[2]) * frac * CELL
      );
    }

    function layoutArrow(arrow, t) {
      const unit = arrow.dir;
      const cubes = arrow.cubes;
      for (let i = 0; i < cubes.length; i++) {
        pathPoint(arrow.cells, unit, t - i, cubes[i].position);
      }
      cubes[0].quaternion.setFromUnitVectors(CONE_UP, unit);
      for (let i = 0; i < arrow.connectors.length; i++) {
        placeConnector(
          arrow.connectors[i],
          cubes[i].position,
          cubes[i + 1].position
        );
      }
    }

    function slitherDuration(cellCount) {
      return (cellCount + GRID) / SLITHER_SPEED;
    }

    function pathClearFrom(hx, hy, hz, dir) {
      let cx = hx + dir.x;
      let cy = hy + dir.y;
      let cz = hz + dir.z;
      while (inBounds(cx, cy, cz)) {
        if (occ.has(key(cx, cy, cz))) return false;
        cx += dir.x;
        cy += dir.y;
        cz += dir.z;
      }
      return true;
    }

    function addArrow(data) {
      const cells = data.cells;
      if (!cells || cells.length < 2) return;

      const colorHex = PALETTE[data.color % PALETTE.length];
      const bodyMat = new THREE.MeshStandardMaterial({
        color: colorHex,
        roughness: 0.45,
        metalness: 0.1,
      });
      const headTint = tintHeadColor(colorHex);
      const headMat = new THREE.MeshStandardMaterial({
        color: headTint,
        roughness: 0.22,
        metalness: 0.35,
        emissive: headTint.clone(),
        emissiveIntensity: 0.16,
      });

      const group = new THREE.Group();
      const id = (arrowIdSeq += 1);
      group.userData.arrowId = id;

      /** @type {THREE.Mesh[]} */
      const cubes = [];
      for (let i = 0; i < cells.length; i++) {
        const [ix, iy, iz] = cells[i];
        const geometry = i === 0 ? coneGeometry : cubeGeometry;
        const cube = new THREE.Mesh(geometry, i === 0 ? headMat : bodyMat);
        cube.position.copy(cellCenter(ix, iy, iz));
        group.add(cube);
        cubes.push(cube);

        const hit = new THREE.Mesh(hitGeometry, hitMaterial);
        hit.position.copy(cube.position);
        hit.userData.isHitProxy = true;
        group.add(hit);
      }

      /** @type {THREE.Mesh[]} */
      const connectors = [];
      for (let i = 0; i < cells.length - 1; i++) {
        const connector = new THREE.Mesh(connectorGeometry, bodyMat);
        placeConnector(connector, cubes[i].position, cubes[i + 1].position);
        group.add(connector);
        connectors.push(connector);
      }

      // Arrowhead: cells are stored head-first, so it points from the head away
      // from the body (cells[0] - cells[1]). cubes[0] is the square pyramid.
      const [hx, hy, hz] = cells[0];
      const [nx, ny, nz] = cells[1];
      const dir = new THREE.Vector3(hx - nx, hy - ny, hz - nz).normalize();

      boardRoot.add(group);

      /** @type {Arrow} */
      const arrow = {
        id,
        cells,
        dir,
        mesh: group,
        cubes,
        connectors,
        tweenTarget: { t: 0 },
        busy: false,
        bodyMat,
        headMat,
        baseColor: colorHex,
      };
      layoutArrow(arrow, 0);
      arrows.set(id, arrow);
      for (const [x, y, z] of cells) {
        occ.set(key(x, y, z), arrow);
      }
    }

    function disposeArrowMaterials(arrow) {
      gsap.killTweensOf(arrow.tweenTarget);
      gsap.killTweensOf(arrow.mesh.position);
      gsap.killTweensOf(arrow.bodyMat.color);
      gsap.killTweensOf(arrow.headMat.color);
      arrow.bodyMat.dispose();
      arrow.headMat.dispose();
    }

    function clearBoard() {
      generationId += 1;
      const live = [...arrows.values(), ...departing];
      for (const arrow of live) {
        if (arrow.mesh.parent) boardRoot.remove(arrow.mesh);
        disposeArrowMaterials(arrow);
      }
      arrows.clear();
      departing.clear();
      occ.clear();
    }

    function buildBoard(data) {
      clearBoard();
      resetAttempt();
      if (data.grid && data.grid !== GRID) {
        console.warn(
          `arrows.json grid (${data.grid}) differs from lattice grid (${GRID}); ` +
            "positions may not align with the wireframe."
        );
      }
      for (const arrow of data.arrows || []) addArrow(arrow);
      updateRemaining();
    }

    function resetBoard() {
      if (!puzzleData) return;
      buildBoard(puzzleData);
    }

    function updateRemaining() {
      remainingEl.textContent = String(arrows.size);
    }

    function formatTime(ms) {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const minutes = Math.floor(totalSec / 60);
      const seconds = totalSec % 60;
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    function heartString(count) {
      const filled = Math.max(0, Math.min(MAX_LIVES, count));
      return "❤️".repeat(filled) + "🤍".repeat(MAX_LIVES - filled);
    }

    function updateLives() {
      const nodes = livesEl.querySelectorAll(".heart");
      nodes.forEach((el, i) => {
        const filled = i < lives;
        el.textContent = filled ? "❤️" : "🤍";
        el.classList.toggle("spent", !filled);
      });
      livesEl.setAttribute(
        "aria-label",
        `${lives} ${lives === 1 ? "life" : "lives"} remaining`
      );
    }

    function updateTimer() {
      timerEl.textContent = formatTime(timeMs);
    }

    function startTimer() {
      if (runOver || timerStartedAt != null) return;
      timerStartedAt = performance.now();
    }

    function freezeTimer() {
      if (timerStartedAt != null) {
        timeMs = Math.max(0, Math.round(performance.now() - timerStartedAt));
      }
      timerStartedAt = null;
      runOver = true;
      updateTimer();
    }

    function resetAttempt() {
      lives = MAX_LIVES;
      timeMs = 0;
      timerStartedAt = null;
      runOver = false;
      submittedScore = false;
      hideResult();
      updateLives();
      updateTimer();
    }

    function hideResult() {
      resultModal.classList.remove("visible");
    }

    function setResultRank(text, isError) {
      if (!text) {
        resultRank.hidden = true;
        resultRank.textContent = "";
        resultRank.classList.remove("error");
        return;
      }
      resultRank.hidden = false;
      resultRank.textContent = text;
      resultRank.classList.toggle("error", Boolean(isError));
    }

    function renderLeaderboard(entries) {
      leaderboardBody.replaceChildren();
      if (!entries.length) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 4;
        cell.className = "empty";
        cell.textContent = "No times yet";
        row.appendChild(cell);
        leaderboardBody.appendChild(row);
        return;
      }
      for (const entry of entries) {
        const row = document.createElement("tr");
        const values = [
          String(entry.rank),
          entry.name,
          formatTime(entry.time_ms),
          heartString(entry.lives_left),
        ];
        for (const value of values) {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.appendChild(cell);
        }
        leaderboardBody.appendChild(row);
      }
    }

    function scoresPath() {
      return currentLevel?.id
        ? `./api/scores?id=${currentLevel.id}`
        : "./api/scores";
    }

    async function loadLeaderboard() {
      renderLeaderboard([]);
      try {
        const data = await fetchJson(scoresPath());
        renderLeaderboard(Array.isArray(data.entries) ? data.entries : []);
      } catch (err) {
        console.error("Failed to load scores:", err);
        renderLeaderboard([]);
      }
    }

    function showResult(kind) {
      const won = kind === "win";
      resultTitle.textContent = won ? "Board cleared!" : "Out of lives";
      resultSummary.textContent = won
        ? "Every arrow found its way out."
        : "Three blocked moves — retry for another attempt.";
      resultTime.textContent = formatTime(timeMs);
      resultLives.textContent = heartString(lives);
      playAgainBtn.textContent = won ? "Play Again" : "Retry";
      scoreForm.hidden = !(won && currentLevel?.id && !submittedScore);
      scoreSubmit.disabled = false;
      if (!scoreForm.hidden) {
        try {
          scoreName.value = localStorage.getItem(NAME_KEY) || "";
        } catch {
          scoreName.value = "";
        }
      }
      setResultRank("");
      resultModal.classList.add("visible");
      loadLeaderboard();
    }

    function tryRemove(arrow) {
      if (runOver) return;
      startTimer();
      const [hx, hy, hz] = arrow.cells[0];
      if (pathClearFrom(hx, hy, hz, arrow.dir)) {
        escapeArrow(arrow);
      } else {
        errorArrow(arrow);
      }
    }

    function escapeArrow(arrow) {
      if (arrow.busy) return;
      arrow.busy = true;
      const mesh = arrow.mesh;
      const gen = generationId;
      const arrowId = arrow.id;

      for (const [x, y, z] of arrow.cells) {
        const k = key(x, y, z);
        if (occ.get(k) === arrow) occ.delete(k);
      }
      arrows.delete(arrow.id);
      departing.add(arrow);
      updateRemaining();
      const clearedBoard = arrows.size === 0;
      if (clearedBoard) freezeTimer();

      mesh.traverse((child) => {
        child.raycast = () => {};
      });

      const tMax = arrow.cells.length + GRID;
      arrow.tweenTarget.t = 0;
      gsap.to(arrow.tweenTarget, {
        t: tMax,
        duration: slitherDuration(arrow.cells.length),
        ease: "power1.in",
        onUpdate: () => layoutArrow(arrow, arrow.tweenTarget.t),
        onComplete: () => {
          departing.delete(arrow);
          if (gen !== generationId || mesh.userData.arrowId !== arrowId) return;
          if (mesh.parent) boardRoot.remove(mesh);
          disposeArrowMaterials(arrow);
          if (clearedBoard && gen === generationId) showResult("win");
        },
      });
    }

    function errorArrow(arrow) {
      if (runOver) return;
      arrow.busy = true;
      const mesh = arrow.mesh;
      const origin = mesh.position.clone();
      const nudge = arrow.dir.clone().normalize().multiplyScalar(0.1);
      const bodyMat = arrow.bodyMat;
      const headMat = arrow.headMat;
      const original = bodyMat.color.getHex();
      const headOriginal = headMat.color.getHex();
      const gen = generationId;
      const arrowId = arrow.id;

      lives = Math.max(0, lives - 1);
      updateLives();
      if (lives === 0) {
        freezeTimer();
        window.setTimeout(() => {
          if (gen === generationId && lives === 0 && !resultModal.classList.contains("visible")) {
            showResult("lose");
          }
        }, 700);
      }

      bodyMat.color.setHex(0xe76f51);
      headMat.color.setHex(0xe76f51);

      const tl = gsap.timeline({
        onComplete: () => {
          if (gen !== generationId || mesh.userData.arrowId !== arrowId) return;
          mesh.position.copy(origin);
          bodyMat.color.setHex(original);
          headMat.color.setHex(headOriginal);
          arrow.busy = false;
          if (lives === 0 && gen === generationId) showResult("lose");
        },
      });

      tl.to(mesh.position, {
        x: origin.x + nudge.x,
        y: origin.y + nudge.y,
        z: origin.z + nudge.z,
        duration: 0.1,
        ease: "power1.out",
      });

      const perp =
        Math.abs(arrow.dir.y) < 0.5
          ? new THREE.Vector3(0, 1, 0)
          : new THREE.Vector3(1, 0, 0);
      const side = new THREE.Vector3()
        .crossVectors(arrow.dir, perp)
        .normalize()
        .multiplyScalar(0.08);

      tl.to(mesh.position, {
        x: origin.x + nudge.x + side.x,
        y: origin.y + nudge.y + side.y,
        z: origin.z + nudge.z + side.z,
        duration: 0.06,
        yoyo: true,
        repeat: 5,
        ease: "power1.inOut",
      });

      tl.to(mesh.position, {
        x: origin.x,
        y: origin.y,
        z: origin.z,
        duration: 0.16,
        ease: "power2.out",
      });

      tl.to(
        {},
        {
          duration: 0.2,
          onStart: () => {
            gsap.to(bodyMat.color, {
              r: ((original >> 16) & 255) / 255,
              g: ((original >> 8) & 255) / 255,
              b: (original & 255) / 255,
              duration: 0.25,
              ease: "power1.out",
            });
            gsap.to(headMat.color, {
              r: ((headOriginal >> 16) & 255) / 255,
              g: ((headOriginal >> 8) & 255) / 255,
              b: (headOriginal & 255) / 255,
              duration: 0.25,
              ease: "power1.out",
            });
          },
        },
        "<"
      );
    }

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerDown = null;

    function setPointerFromEvent(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function onPointerDown(event) {
      if (event.button !== 0) return;
      pointerDown = { x: event.clientX, y: event.clientY };
    }

    function findArrowFromHit(hitObject) {
      let obj = hitObject;
      while (obj && obj.parent !== boardRoot) obj = obj.parent;
      if (!obj || obj.userData.arrowId == null) return null;
      return arrows.get(obj.userData.arrowId) || null;
    }

    function onPointerUp(event) {
      if (event.button !== 0 || !pointerDown) return;
      const dx = event.clientX - pointerDown.x;
      const dy = event.clientY - pointerDown.y;
      pointerDown = null;

      if (Math.hypot(dx, dy) >= 5) return;
      if (runOver || resultModal.classList.contains("visible")) return;

      setPointerFromEvent(event);
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(boardRoot.children, true);
      for (const hit of hits) {
        const arrow = findArrowFromHit(hit.object);
        if (!arrow || arrow.busy) continue;
        tryRemove(arrow);
        return;
      }
    }

    function autoSolveStep() {
      for (const arrow of arrows.values()) {
        if (arrow.busy) continue;
        const [hx, hy, hz] = arrow.cells[0];
        if (pathClearFrom(hx, hy, hz, arrow.dir)) {
          escapeArrow(arrow);
          return true;
        }
      }
      return false;
    }

    window.__arrowOut = {
      reset: () => resetBoard(),
      remaining: () => arrows.size,
      autoSolveStep,
      autoSolveAll: async () => {
        while (arrows.size > 0) {
          if (!autoSolveStep()) break;
          await new Promise((r) => setTimeout(r, 1100));
        }
      },
      setGridVisible,
      slitherDebug: () =>
        [...departing].map((a) => ({
          id: a.id,
          t: a.tweenTarget.t,
          n: a.cells.length,
          cubes: a.cubes.map((c) => [c.position.x, c.position.y, c.position.z]),
        })),
    };

    renderer.domElement.addEventListener("pointerdown", onPointerDown);
    renderer.domElement.addEventListener("pointerup", onPointerUp);
    renderer.domElement.addEventListener("pointercancel", () => {
      pointerDown = null;
    });

    resetBtn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      resetBoard();
      remainingEl.animate(
        [{ transform: "scale(1)" }, { transform: "scale(1.2)" }, { transform: "scale(1)" }],
        { duration: 280 }
      );
    });
    playAgainBtn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      resetBoard();
    });
    scoreForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (submittedScore || !currentLevel?.id) return;
      const name = scoreName.value.trim();
      if (!/^[A-Za-z0-9 _-]{1,16}$/.test(name)) {
        setResultRank("Use 1–16 letters, numbers, spaces, _ or -.", true);
        return;
      }
      scoreSubmit.disabled = true;
      try {
        const res = await fetch("./api/scores", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: currentLevel.id,
            name,
            time_ms: timeMs,
            lives_left: lives,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          setResultRank(data.error || `Submit failed (${res.status})`, true);
          scoreSubmit.disabled = false;
          return;
        }
        submittedScore = true;
        scoreForm.hidden = true;
        try {
          localStorage.setItem(NAME_KEY, name);
        } catch {
          /* ignore quota / private mode */
        }
        if (data.rank != null) {
          setResultRank(`Your rank: ${data.rank}`);
        } else {
          setResultRank("");
        }
        await loadLeaderboard();
      } catch (err) {
        console.error("Failed to submit score:", err);
        setResultRank("Could not submit score.", true);
        scoreSubmit.disabled = false;
      }
    });
    window.addEventListener("keydown", (e) => {
      if (e.key === "r" || e.key === "R") {
        const tag = e.target && e.target.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA") return;
        resetBoard();
      }
      if (e.key === "ArrowLeft") {
        const idx = currentIndex();
        if (idx > 0) showLevel(archive[idx - 1]);
      }
      if (e.key === "ArrowRight") {
        const idx = currentIndex();
        if (idx >= 0 && idx < archive.length - 1) showLevel(archive[idx + 1]);
      }
    });

    let archive = [];
    let currentLevel = null;
    let loadingLevel = false;

    function formatDayLabel(level) {
      if (!level) return "Today";
      if (level.is_current) return "Today";
      const seed = level.seed == null ? "" : String(level.seed);
      const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(seed);
      if (match) {
        const date = new Date(Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3])));
        return date.toLocaleDateString("en-GB", {
          day: "numeric",
          month: "short",
          timeZone: "UTC",
        });
      }
      return seed || `#${level.id}`;
    }

    function currentIndex() {
      if (!currentLevel) return -1;
      return archive.findIndex((level) => level.id === currentLevel.id);
    }

    function updateDayNav() {
      const visible = archive.length >= 1 && currentLevel != null;
      dayNav.hidden = !visible;
      dayDivider.hidden = !visible;
      if (!visible) return;

      const idx = currentIndex();
      const many = archive.length > 1;
      dayPrevBtn.hidden = !many;
      dayNextBtn.hidden = !many;
      dayPrevBtn.disabled = loadingLevel || idx <= 0;
      dayNextBtn.disabled = loadingLevel || idx < 0 || idx >= archive.length - 1;
      dayLabel.textContent = formatDayLabel(currentLevel);
    }

    function syncUrl(level) {
      const url = new URL(window.location.href);
      if (!level || level.is_current) {
        url.searchParams.delete("id");
      } else {
        url.searchParams.set("id", String(level.id));
      }
      history.replaceState(null, "", url);
    }

    async function fetchJson(path) {
      const res = await fetch(path, { cache: "no-cache" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    async function loadArchive() {
      try {
        const data = await fetchJson("./api/archive");
        archive = Array.isArray(data.levels) ? data.levels : [];
      } catch {
        archive = [];
      }
    }

    async function loadPuzzle(level) {
      const path = level && !level.is_current
        ? `./arrows.json?id=${level.id}`
        : "./arrows.json";
      const data = await fetchJson(path);
      puzzleData = data;
      currentLevel = level ?? null;
      if (level && archive.some((row) => row.id === level.id)) {
        currentLevel = archive.find((row) => row.id === level.id);
      }
      buildBoard(puzzleData);
      syncUrl(currentLevel);
      updateDayNav();
    }

    async function showLevel(level) {
      if (!level || loadingLevel) return;
      if (currentLevel && currentLevel.id === level.id) return;
      loadingLevel = true;
      updateDayNav();
      try {
        await loadPuzzle(level);
      } catch (err) {
        console.error("Failed to load puzzle:", err);
      } finally {
        loadingLevel = false;
        updateDayNav();
      }
    }

    dayPrevBtn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      const idx = currentIndex();
      if (idx > 0) showLevel(archive[idx - 1]);
    });
    dayNextBtn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      const idx = currentIndex();
      if (idx >= 0 && idx < archive.length - 1) showLevel(archive[idx + 1]);
    });

    try {
      await loadArchive();
      const requested = Number(params.get("id"));
      const hasId = Number.isInteger(requested) && requested > 0;
      const fromUrl = hasId ? archive.find((level) => level.id === requested) : null;
      const live = archive.find((level) => level.is_current) ?? null;
      if (hasId && !fromUrl) {
        await loadPuzzle({ id: requested, seed: null, is_current: false });
      } else {
        await loadPuzzle(fromUrl ?? live);
      }
    } catch (err) {
      console.error("Failed to load arrows.json:", err);
      try {
        puzzleData = await fetchJson("./arrows.json");
        buildBoard(puzzleData);
        currentLevel = archive.find((level) => level.is_current) ?? null;
        updateDayNav();
      } catch (inner) {
        console.error("Failed to load arrows.json:", inner);
      }
    }

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }

    window.addEventListener("resize", resize);
    resize();

    function tick() {
      if (timerStartedAt != null && !runOver) {
        timeMs = Math.max(0, Math.round(performance.now() - timerStartedAt));
        updateTimer();
      }
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }

    tick();
  </script>
</body>
</html>
